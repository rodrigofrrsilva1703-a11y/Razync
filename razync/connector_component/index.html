<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#eaf5f8;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:transparent}
.card{border:1px solid rgba(99,203,239,.26);border-radius:12px;padding:12px;background:rgba(9,28,38,.82)}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
.title{font-size:13px;font-weight:700}.sub{font-size:11px;color:#9fb6bf;margin-top:3px;line-height:1.45}
.dot{width:8px;height:8px;border-radius:50%;background:#6b7c83}.dot.ok{background:#36d399}.dot.warn{background:#f5b942}
button,input,select{width:100%;border-radius:8px;border:1px solid rgba(108,188,216,.28);background:#102c38;color:#edf9fc;padding:8px 10px;font-size:12px}
button{cursor:pointer;font-weight:650;margin-top:8px}button.primary{background:#147da5;border-color:#36bce9}
button:hover{filter:brightness(1.1)}input,select{margin-top:9px}
.hidden{display:none!important}.error{font-size:11px;color:#ff9d9d;margin-top:7px}
.success{font-size:11px;color:#78e4ae;margin-top:7px}
</style>
</head>
<body>
<div id="certificateCard" class="card">
  <div class="row"><span id="dot" class="dot"></span><div class="grow">
    <div class="title">Certificado instalado no Windows</div>
    <div id="status" class="sub">Verificando o conector…</div>
  </div></div>
  <div id="offline" class="hidden"><div class="sub" style="margin-top:9px">Abra o Conector Razync neste computador.</div><button id="retry">Verificar novamente</button></div>
  <div id="pair" class="hidden"><input id="code" inputmode="numeric" maxlength="6" placeholder="Código de 6 dígitos exibido pelo conector"><button id="pairButton" class="primary">Parear computador</button></div>
  <div id="ready" class="hidden"><select id="certificates"></select><button id="selectButton" class="primary">Usar este certificado</button></div>
  <div id="error" class="error hidden"></div>
</div>

<div id="dctfCard" class="card hidden">
  <div class="row"><span id="dctfDot" class="dot"></span><div class="grow">
    <div class="title">Consulta DCTFWeb pelo Conector</div>
    <div id="dctfStatus" class="sub">Verificando o conector…</div>
  </div></div>
  <div id="dctfActions" class="hidden">
    <button id="openDctf" class="primary">1. Abrir Portal da Receita</button>
    <div class="sub" style="margin-top:8px">No Portal da Receita, clique no avatar, represente o CNPJ como Procurador digital e abra a DCTFWeb da competência. Baixe o relatório e volte aqui.</div>
    <button id="findReport">2. Trazer relatório baixado para o Razync</button>
  </div>
  <div id="dctfError" class="error hidden"></div>
  <div id="dctfSuccess" class="success hidden"></div>
</div>

<script>
const API_VERSION=1;let args={};
const $=id=>document.getElementById(id);
function post(type,data={}){window.parent.postMessage({isStreamlitMessage:true,type,...data},"*")}
function value(v){post("streamlit:setComponentValue",{value:v})}
function height(){post("streamlit:setFrameHeight",{height:document.documentElement.scrollHeight})}
function tokenKey(){return "razync_connector_token_v1"}
function headers(){const t=localStorage.getItem(tokenKey());return t?{Authorization:"Bearer "+t}:{}}
function message(id,text){$(id).textContent=text;$(id).classList.toggle("hidden",!text);height()}
function showCertificate(id){["offline","pair","ready"].forEach(x=>$(x).classList.toggle("hidden",x!==id));height()}
async function request(path,options={},timeout=5000){
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
  try{return await fetch((args.connector_url||"http://127.0.0.1:17891")+path,{...options,headers:{...(options.headers||{}),...headers()},signal:controller.signal,cache:"no-store"})}
  finally{clearTimeout(timer)}
}
async function loadCertificates(){
  const response=await request("/v1/certificates",{},15000);
  if(response.status===401){localStorage.removeItem(tokenKey());showCertificate("pair");$("status").textContent="Conector encontrado — informe o código";return}
  if(!response.ok)throw new Error("Não foi possível ler os certificados.");
  const data=await response.json(),list=data.certificates||[],select=$("certificates");select.innerHTML="";
  if(!list.length){const op=document.createElement("option");op.textContent="Nenhum certificado com chave privada";op.value="";select.appendChild(op)}
  list.forEach((cert,index)=>{const op=document.createElement("option");op.value=String(index);op.textContent=(cert.subject||"Certificado")+" · até "+String(cert.valid_to||"").slice(0,10);select.appendChild(op)});
  select._certificates=list;showCertificate("ready");$("dot").className="dot ok";$("status").textContent=list.length+" certificado(s) disponível(is)";value({status:"ready",count:list.length})
}
async function detectCertificate(){
  message("error","");$("status").textContent="Verificando o conector…";$("dot").className="dot";
  try{const health=await request("/v1/health");if(!health.ok)throw new Error();
    if(localStorage.getItem(tokenKey()))await loadCertificates();
    else{showCertificate("pair");$("dot").className="dot warn";$("status").textContent="Conector encontrado — pareamento necessário";value({status:"pairing"})}
  }catch(e){showCertificate("offline");$("status").textContent="Conector não encontrado";value({status:"offline"})}
}
async function detectDctf(){
  message("dctfError","");message("dctfSuccess","");
  try{const health=await request("/v1/health");if(!health.ok)throw new Error();
    if(!localStorage.getItem(tokenKey())){$("dctfStatus").textContent="Pareie o conector no botão Certificado";$("dctfDot").className="dot warn";value({status:"pairing"});return}
    $("dctfDot").className="dot ok";$("dctfStatus").textContent="Conector ativo · competência "+(args.competencia||"selecionada");$("dctfActions").classList.remove("hidden");value({status:"ready"})
  }catch(e){$("dctfStatus").textContent="Conector não encontrado. Abra o atalho da Área de Trabalho.";$("dctfActions").classList.add("hidden");value({status:"offline"})}
  height()
}
$("retry").onclick=detectCertificate;
$("pairButton").onclick=async()=>{message("error","");const code=$("code").value.trim();if(!/^\d{6}$/.test(code)){message("error","Informe o código de 6 dígitos.");return}
  try{const response=await request("/v1/pair",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code})});const data=await response.json();if(!response.ok)throw new Error(data.error||"Pareamento recusado.");localStorage.setItem(tokenKey(),data.token);await loadCertificates()}catch(e){message("error",e.message||"Falha no pareamento.")}};
$("selectButton").onclick=()=>{const list=$("certificates")._certificates||[],cert=list[Number($("certificates").value)];if(cert){localStorage.setItem("razync_selected_certificate",JSON.stringify(cert));value({status:"selected",certificate:cert})}};
$("openDctf").onclick=async()=>{message("dctfError","");try{const response=await request("/v1/dctf/open",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});const data=await response.json();if(!response.ok)throw new Error(data.error||"Não foi possível abrir o Portal da Receita.");message("dctfSuccess","Portal da Receita aberto. Entre como Procurador digital da empresa, baixe o relatório da DCTFWeb e volte ao Razync.")}catch(e){message("dctfError",e.message)}};
$("findReport").onclick=async()=>{message("dctfError","");message("dctfSuccess","Localizando o relatório em Downloads…");try{const response=await request("/v1/dctf/latest",{},15000);const data=await response.json();if(!response.ok)throw new Error(data.error||"Relatório não encontrado.");message("dctfSuccess","Relatório encontrado: "+data.name);value({status:"report",name:data.name,content:data.content,modified_at:data.modified_at})}catch(e){message("dctfSuccess","");message("dctfError",e.message)}};
window.addEventListener("message",event=>{if(event.data.type!=="streamlit:render")return;args=event.data.args||{};const dctf=args.mode==="dctf";$("certificateCard").classList.toggle("hidden",dctf);$("dctfCard").classList.toggle("hidden",!dctf);dctf?detectDctf():detectCertificate()});
post("streamlit:componentReady",{apiVersion:API_VERSION});height();
</script>
</body>
</html>
