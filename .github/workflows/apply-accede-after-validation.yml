name: Aplicar ACCEDE após validação

on:
  workflow_run:
    workflows: ["Validar Razync"]
    types: [completed]

permissions:
  contents: write

env:
  APPLY_ACCEDE_VERSION: "1"

jobs:
  aplicar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar integração ACCEDE
        run: python scripts/patch_accede_empresas.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/*.py
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Executar testes
        run: pytest -q
      - name: Testar inicialização Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/accede-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for tentativa in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/accede-streamlit.log
          exit 1
      - name: Gravar app atualizado
        run: |
          if git diff --quiet -- app.py; then
            echo 'Sem alterações no app.py'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Integra ACCEDE Automação e Equipamentos ao Razync'
          git push origin main
