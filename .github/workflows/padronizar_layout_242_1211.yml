name: Padronizar layout 242 e 1211
on:
  push:
    branches: [main]
    paths:
      - 'scripts/padronizar_layout_242_1211.py'
      - '.github/workflows/padronizar_layout_242_1211.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar padronização
        run: python scripts/padronizar_layout_242_1211.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar padrão visual
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8')
          assert "aba_operacoes_gz, aba_base_gz = st.tabs" in t
          assert "aba_operacoes_ef, aba_base_ef = st.tabs" in t
          assert 'aba_conferencia_gz' not in t
          assert 'aba_conferencia_ef' not in t
          print('OK')
          PY
      - name: Commitar e limpar temporários
        run: |
          rm scripts/padronizar_layout_242_1211.py
          rm .github/workflows/padronizar_layout_242_1211.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/padronizar_layout_242_1211.py .github/workflows/padronizar_layout_242_1211.yml
          git commit -m 'Padroniza layout das empresas 242 e 1211'
          git push
