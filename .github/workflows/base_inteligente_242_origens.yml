name: Base Inteligente 242 por origem

on:
  push:
    branches: [main]
    paths:
      - 'scripts/base_inteligente_242_origens.py'
      - '.github/workflows/base_inteligente_242_origens.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar alteração
        run: python scripts/base_inteligente_242_origens.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar regras da 242
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          checks = [
              "def renderizar_base_inteligente_eletro_forte()",
              "('Fornecedor', 'debito', {'166', '0'})",
              "('Recebido', 'credito', {'166', '0', '14', '16'})",
              "empresa_classificacao='eletro_forte'" if False else "'eletro_forte',",
              "identificar_banco_classificacao_eletro_forte",
              "renderizar_base_inteligente_eletro_forte()",
          ]
          for check in checks:
              assert check in s, check
          PY
      - name: Commitar alteração e limpar temporários
        run: |
          rm -f scripts/base_inteligente_242_origens.py .github/workflows/base_inteligente_242_origens.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/base_inteligente_242_origens.py .github/workflows/base_inteligente_242_origens.yml
          git commit -m "Separa classificação da empresa 242 por planilha"
          git push origin main
