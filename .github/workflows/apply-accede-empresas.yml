name: Integrar empresas ACCEDE

on:
  push:
    paths:
      - 'scripts/patch_accede_empresas.py'
      - '.github/workflows/apply-accede-empresas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar integração ACCEDE
        run: python scripts/patch_accede_empresas.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/companies.py
      - name: Validar integração
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          companies = Path('razync/companies.py').read_text(encoding='utf-8')
          checks = [
              '1000 - ACCEDE AUTOMAÇÃO',
              '1001 - ACCEDE EQUIPAMENTOS',
              'def processar_planilha_accede_sig(file_bytes, banco_nome):',
              "{'itau', 'sicredi'}",
              "'sicredi': '505'",
              "renderizar_conferencia_autokraft(\n                slug_accede,",
          ]
          for c in checks[:-1]:
              assert c in app or c in companies, c
          assert checks[-1] in app
          print('Integração ACCEDE validada.')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações no app.py"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Integra ACCEDE Automação e Equipamentos ao Razync"
          git push
