name: Corrigir abas Autokraft

on:
  push:
    paths:
      - 'scripts/patch_autokraft_abas_data.py'
      - '.github/workflows/apply-autokraft-abas-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/patch_autokraft_abas_data.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar leitor Autokraft
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert "re.fullmatch(r'\\d{2}[.-]\\d{2}', str(aba).strip())" in s
          assert "partes_data = re.split(r'[.-]', str(nome_aba).strip())" in s
          testes = ['01-07', '31-07', '01.06', '30.06']
          for aba in testes:
              assert re.fullmatch(r'\d{2}[.-]\d{2}', aba)
          for aba in ['PAGAMENTO COMP.06.26', 'ADIANTAMENTO COMP. 07.26', 'Resumo']:
              assert not re.fullmatch(r'\d{2}[.-]\d{2}', aba)
          print('Formatos novos e antigos validados.')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Aceita abas DD-MM nos mapas Autokraft"
          git push
