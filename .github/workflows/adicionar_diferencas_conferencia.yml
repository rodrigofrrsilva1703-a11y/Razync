name: Diferenças conferência

on:
  push:
    branches: [main]
    paths:
      - 'scripts/adicionar_diferencas_conferencia.py'
      - '.github/workflows/adicionar_diferencas_conferencia.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/adicionar_diferencas_conferencia.py
      - run: python -m py_compile app.py
      - name: Validar colunas
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert s.count("'Diferença Entradas'") >= 2
          assert s.count("'Diferença Saídas'") >= 2
          print('Diferenças validadas')
          PY
      - name: Commitar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Mostra diferenças de entradas e saídas na conferência' || exit 0
          git push
