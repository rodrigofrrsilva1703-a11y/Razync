name: Integrar empresa 968 Radani
on:
  push:
    paths:
      - 'scripts/integrate_radani_968.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar integração
        run: python scripts/integrate_radani_968.py
      - name: Instalar dependências mínimas
        run: pip install pandas openpyxl pytest pypdf
      - name: Validar
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app.py razync/radani.py razync/company_catalog.py
          pytest -q tests/test_radani.py
          grep -q "empresa_organizador'] == 'radani'" app.py
          grep -q '"chave_sistema": "radani"' razync/company_catalog.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/integrate_radani_968.py .github/workflows/integrate_radani_968.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/company_catalog.py razync/radani.py tests/test_radani.py scripts/integrate_radani_968.py .github/workflows/integrate_radani_968.yml
          git commit -m 'Integra ferramentas inteligentes da empresa 968 Radani'
          git push
