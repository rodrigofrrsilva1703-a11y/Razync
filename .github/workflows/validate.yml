name: Validar Razync

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/*.py
      - name: Executar testes
        run: pytest -q
      - name: Verificar componentes críticos
        run: |
          python - <<'PY'
          from pathlib import Path
          from razync.companies import CONFIGURACOES_ACCEDE

          app = Path('app.py').read_text(encoding='utf-8')
          requirements = Path('requirements.txt').read_text(encoding='utf-8')
          packages = Path('packages.txt').read_text(encoding='utf-8')
          checks_app = [
              'def processar_pdf_daycoval_detalhado',
              'def processar_pdf_itau_detalhado',
              'def processar_pdf_bradesco_mensal',
              'def processar_pdf_fibra_extrato',
              'def processar_planilha_accede_sig',
              "reader._razync_source_path = caminho_pdf",
              "getattr(reader, '_razync_source_path', None)",
              "return 'sicredi'",
          ]
          for check in checks_app:
              assert check in app, check

          esperado = {
              'accede_automacao': ('1000 - ACCEDE AUTOMAÇÃO', {'itau': '508', 'sicredi': '505'}),
              'accede_equipamentos': ('1001 - ACCEDE EQUIPAMENTOS', {'itau': '508', 'sicredi': '505'}),
          }
          for chave, (nome, contas) in esperado.items():
              config = CONFIGURACOES_ACCEDE[chave]
              assert config['empresa'] == nome
              assert config['contas_bancarias'] == contas

          for check in ['PyMuPDF', 'pytesseract']:
              assert check in requirements, check
          for check in ['tesseract-ocr', 'tesseract-ocr-por']:
              assert check in packages, check
          print('Componentes críticos validados.')
          PY
      - name: Verificar placeholders e segredos
        run: |
          ! grep -R -n -E 'PLACEHOLDER|YOUR-PASSWORD|sb_secret_[A-Za-z0-9_-]+' -- app.py razync .streamlit
      - name: Iniciar Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/razync-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for tentativa in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
            cat /tmp/razync-streamlit.log
            exit 1
          fi
