name: Validar Razync

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Aplicar integração ACCEDE
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/patch_accede_empresas.py
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/*.py
      - name: Executar testes
        run: pytest -q
      - name: Verificar integração ACCEDE
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          companies = Path('razync/companies.py').read_text(encoding='utf-8')
          checks = [
              '1000 - ACCEDE AUTOMAÇÃO',
              '1001 - ACCEDE EQUIPAMENTOS',
              'def processar_planilha_accede_sig(file_bytes, banco_nome):',
              "return 'sicredi'",
              "{'nome': 'Sicredi', 'slug': 'sicredi'}",
              "'sicredi': '505'",
          ]
          for check in checks:
              assert check in app or check in companies, check
          print('ACCEDE integrada e validada.')
          PY
      - name: Verificar placeholders e segredos
        run: |
          ! grep -R -n -E 'PLACEHOLDER|YOUR-PASSWORD|sb_secret_[A-Za-z0-9_-]+' -- app.py razync .streamlit
      - name: Iniciar Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/razync-streamlit.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for tentativa in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              break
            fi
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
            cat /tmp/razync-streamlit.log
            exit 1
          fi
      - name: Gravar integração validada
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- app.py; then
            echo "app.py já estava atualizado"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Integra ACCEDE Automação e Equipamentos ao Razync"
          git push
