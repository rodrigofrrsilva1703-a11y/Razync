name: Ignorar Principal Base 242

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ignorar_principal_base_242.py'
      - '.github/workflows/ignorar_principal_base_242.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ignorar_principal_base_242.py
      - run: python -m py_compile app.py
      - name: Validar regra
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert "empresa == 'eletro_forte' and normalizar_texto(nome_aba).strip() == 'principal'" in s
          assert "empresa_classificacao == 'eletro_forte' and normalizar_texto(ws.title).strip() == 'principal'" in s
          assert "('Despesa', 'debito', {'0'})" in s
          print('Regra 242 validada')
          PY
      - name: Commitar ajuste
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git rm scripts/ignorar_principal_base_242.py .github/workflows/ignorar_principal_base_242.yml
          git commit -m 'Ignora aba Principal na Base Inteligente da empresa 242'
          git push
