name: Aplicar abas bancárias Nibo 1529

on:
  push:
    branches:
      - agent/dias-pereira-abas-bancos
    paths:
      - 'scripts/apply_dias_pereira_bank_tabs.py'
      - '.github/workflows/apply_dias_pereira_bank_tabs.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dias-pereira-abas-bancos
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Aplicar alteração
        run: python scripts/apply_dias_pereira_bank_tabs.py
      - name: Validar
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Limpar temporários e registrar
        run: |
          rm -f scripts/apply_dias_pereira_bank_tabs.py
          rm -f .github/workflows/apply_dias_pereira_bank_tabs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/apply_dias_pereira_bank_tabs.py .github/workflows/apply_dias_pereira_bank_tabs.yml
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para registrar'
          else
            git commit -m 'Separa Itaú e Banco do Brasil em abas no arquivo da 1529'
            git push origin HEAD:agent/dias-pereira-abas-bancos
          fi
