name: Aplicar alinhamento da pesquisa

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_company_search_alignment.py'
      - '.github/workflows/apply_company_search_alignment.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção visual
        run: python scripts/fix_company_search_alignment.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Registrar alteração e limpar patch temporário
        run: |
          rm scripts/fix_company_search_alignment.py
          rm .github/workflows/apply_company_search_alignment.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_company_search_alignment.py .github/workflows/apply_company_search_alignment.yml
          git commit -m 'Uniformiza tamanho e alinhamento da pesquisa de empresas'
          git push
