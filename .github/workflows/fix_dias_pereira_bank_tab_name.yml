name: Corrigir abas Nibo 1529
on:
  push:
    branches: [agent/fix-dias-pereira-bank-tab-name]
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dias-pereira-bank-tab-name
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Aplicar correção
        run: python scripts/fix_dias_pereira_bank_tab_name.py
      - name: Validar
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert "'aba': 'Itaú'" in s
          assert "'aba': 'Banco do Brasil'" in s
          assert "config_banco_nibo['nome']" not in s
          assert s.count("config_banco_nibo['aba']") == 2
          PY
      - name: Limpar temporários e registrar
        run: |
          rm scripts/fix_dias_pereira_bank_tab_name.py
          rm .github/workflows/fix_dias_pereira_bank_tab_name.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_dias_pereira_bank_tab_name.py .github/workflows/fix_dias_pereira_bank_tab_name.yml
          git commit -m 'Corrige nomes das abas bancárias da 1529'
          git push origin HEAD:agent/fix-dias-pereira-bank-tab-name
