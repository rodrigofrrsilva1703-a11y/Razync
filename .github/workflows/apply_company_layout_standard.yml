name: Aplicar layout padrão das empresas
on:
  push:
    paths:
      - 'scripts/standardize_company_layouts.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar padronização
        run: python scripts/standardize_company_layouts.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar layout padrão
        run: |
          grep -q 'Company workspace standard v2' app.py
          grep -q 'rz-company-hero__title' app.py
          grep -q 'Área operacional' app.py
      - name: Registrar alteração e limpar temporários
        run: |
          rm -f scripts/standardize_company_layouts.py .github/workflows/apply_company_layout_standard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/standardize_company_layouts.py .github/workflows/apply_company_layout_standard.yml
          git commit -m 'Padroniza layout das áreas de empresas'
          git push
