name: Corrigir Caixa conferencia 625
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_625_caixa_multi.py
      - .github/workflows/fix_625_caixa_multi.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_625_caixa_multi.py
      - run: python -m py_compile app.py razync/valean_625.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert 'if "caixa" in nome_arquivo or "cef" in nome_arquivo:' in s
          assert 'return processar_extrato_625(file_bytes, banco_625).to_dict("records")' in s
          print('Validação OK: Caixa 625 usa parser dedicado também com múltiplos extratos')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Usa parser Caixa 625 com múltiplos extratos"
          git rm scripts/fix_625_caixa_multi.py .github/workflows/fix_625_caixa_multi.yml
          git commit -m "Remove correção temporária Caixa 625"
          git push
