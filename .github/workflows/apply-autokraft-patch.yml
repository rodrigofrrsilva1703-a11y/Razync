name: Apply Autokraft companies patch

on:
  push:
    paths:
      - 'scripts/patch_autokraft_companies.py'
      - '.github/workflows/apply-autokraft-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/patch_autokraft_companies.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit app update
        run: |
          if git diff --quiet -- app.py; then
            echo "No app.py changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Libera ferramentas para todas as empresas Autokraft"
          git push
