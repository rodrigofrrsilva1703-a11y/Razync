name: Aplicar modelo fiel no Conversor

on:
  push:
    paths:
      - 'scripts/patch_converter_modelo_dominio.py'
      - '.github/workflows/apply-converter-model.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção do Conversor
        run: python scripts/patch_converter_modelo_dominio.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Commit da correção
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Exporta Conversor usando o Modelo Domínio original"
          git push
