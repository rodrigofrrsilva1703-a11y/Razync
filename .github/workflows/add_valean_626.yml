name: Add Valean 626

on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_valean_626.py'
      - '.github/workflows/add_valean_626.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar integração 626
        run: python scripts/add_valean_626.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py app_legacy.py razync/valean_626.py
      - name: Commitar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py app_legacy.py
          git commit -m "Integra empresa 626 com múltiplos períodos" || true
          git push
      - name: Limpar patch temporário
        run: |
          git pull --rebase
          git rm -f scripts/add_valean_626.py .github/workflows/add_valean_626.yml
          git commit -m "Remove patch temporário da empresa 626" || true
          git push
