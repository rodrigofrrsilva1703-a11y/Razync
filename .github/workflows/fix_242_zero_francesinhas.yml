name: Corrigir 242 zero e francesinhas
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_242_zero_and_francesinhas.py'
      - '.github/workflows/fix_242_zero_francesinhas.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_242_zero_and_francesinhas.py
      - run: python -m py_compile app.py razync/eletro_forte.py razync/eletro_forte_francesinhas.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/eletro_forte.py
          git commit -m 'Corrige zero da Base e correspondencia das francesinhas 242' || true
          git rm scripts/fix_242_zero_and_francesinhas.py .github/workflows/fix_242_zero_francesinhas.yml
          git commit -m 'Remove ajuste temporario da 242'
          git push
