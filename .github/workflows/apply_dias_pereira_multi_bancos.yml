name: Aplicar seleção múltipla Nibo 1529

on:
  push:
    branches:
      - agent/dias-pereira-dois-bancos

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/dias-pereira-dois-bancos
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Aplicar alteração
        run: python scripts/apply_dias_pereira_multi_bancos.py
      - name: Validar
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
          grep -q "Bancos deste processamento Nibo" app.py
          grep -q "pd.concat(quadros_nibo" app.py
          grep -q "bancos_slugs_nibo" app.py
      - name: Limpar temporários e registrar
        run: |
          rm scripts/apply_dias_pereira_multi_bancos.py
          rm .github/workflows/apply_dias_pereira_multi_bancos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/apply_dias_pereira_multi_bancos.py .github/workflows/apply_dias_pereira_multi_bancos.yml
          git commit -m "Permite processar Itaú e Banco do Brasil juntos na 1529"
          git push origin HEAD:agent/dias-pereira-dois-bancos
