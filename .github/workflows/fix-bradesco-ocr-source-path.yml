name: Corrigir caminho OCR Bradesco

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_bradesco_ocr_source_path.py'
      - '.github/workflows/fix-bradesco-ocr-source-path.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Aplicar correção
        run: python scripts/fix_bradesco_ocr_source_path.py
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/*.py
      - name: Verificar correção do caminho
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          assert "reader._razync_source_path = caminho_pdf" in app
          assert "getattr(reader, '_razync_source_path', None)" in app
          assert "fitz.Matrix(4.0, 4.0)" in app
          assert "lang='por'" in app
          print('Caminho OCR preservado corretamente.')
          PY
      - name: Executar testes
        run: pytest -q
      - name: Iniciar Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/razync-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for tentativa in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/razync-streamlit.log
          exit 1
      - name: Gravar correção
        run: |
          if git diff --quiet -- app.py; then
            echo 'Sem alterações em app.py'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Corrige acesso ao PDF no OCR Bradesco'
          git push origin main
