name: Aplicar loading de empresa
on:
  push:
    paths:
      - 'scripts/add_company_loading_transition.py'
      - '.github/workflows/apply_company_loading.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar transição
        run: python scripts/add_company_loading_transition.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar transição
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert "_rz_empresa_loading" in text
          assert "rz-company-loading-overlay" in text
          assert "time.sleep(0.16)" in text
          print('Transição validada')
          PY
      - name: Registrar alteração e limpar temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/add_company_loading_transition.py .github/workflows/apply_company_loading.yml
          git add app.py scripts/add_company_loading_transition.py .github/workflows/apply_company_loading.yml
          git commit -m "Adiciona loading suave ao abrir empresas"
          git push
