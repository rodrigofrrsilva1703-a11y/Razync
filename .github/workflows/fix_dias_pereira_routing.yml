name: Corrigir roteamento empresa 1529

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_dias_pereira_routing.py'
      - '.github/workflows/fix_dias_pereira_routing.yml'

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/fix_dias_pereira_routing.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/company_catalog.py razync/nibo.py
      - name: Limpar temporários e registrar
        run: |
          rm scripts/fix_dias_pereira_routing.py
          rm .github/workflows/fix_dias_pereira_routing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_dias_pereira_routing.py .github/workflows/fix_dias_pereira_routing.yml
          git commit -m 'Corrige abertura da ferramenta Nibo da empresa 1529'
          git push origin main
