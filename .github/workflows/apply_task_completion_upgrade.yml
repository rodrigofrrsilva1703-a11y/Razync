name: Aplicar automação da Central de Tarefas

on:
  push:
    paths:
      - 'scripts/upgrade_task_completion.py'
      - '.github/workflows/apply_task_completion_upgrade.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar atualização
        run: python scripts/upgrade_task_completion.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Rodar testes relevantes
        run: |
          python -m pip install -q pytest
          pytest -q tests/test_task_center.py tests/test_task_completion_integration.py tests/test_lcarlos.py
      - name: Registrar alteração e limpar temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py tests/test_task_completion_integration.py
          git rm scripts/upgrade_task_completion.py .github/workflows/apply_task_completion_upgrade.yml
          git commit -m "Automatiza conclusão da Central de Tarefas"
          git push
