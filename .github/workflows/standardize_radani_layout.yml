name: Padronizar layout empresa 968 Radani

on:
  push:
    branches: [main]
    paths:
      - 'scripts/standardize_radani_layout.py'
      - '.github/workflows/standardize_radani_layout.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar padronização
        run: python scripts/standardize_radani_layout.py
      - name: Instalar dependências mínimas
        run: pip install -q streamlit pandas pypdf openpyxl pytest
      - name: Validar
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile app.py razync/radani.py
          pytest -q tests/test_radani.py
      - name: Registrar e limpar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/standardize_radani_layout.py .github/workflows/standardize_radani_layout.yml
          git add -A
          git commit -m 'Padroniza layout da empresa 968 sem perder performance'
          git push
