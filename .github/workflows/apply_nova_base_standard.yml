name: Padronizar Base Inteligente Nova Geração
on:
  push:
    paths:
      - 'scripts/standardize_nova_base.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/standardize_nova_base.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar componente padrão
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          alvo = "renderizar_base_inteligente_empresa(\n                empresa_base_nova,\n                nome_base_nova"
          assert alvo in s
          PY
      - name: Registrar alteração e limpar temporários
        run: |
          rm -f scripts/standardize_nova_base.py .github/workflows/apply_nova_base_standard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/standardize_nova_base.py .github/workflows/apply_nova_base_standard.yml
          git commit -m 'Padroniza Base Inteligente da Nova Geração'
          git push
