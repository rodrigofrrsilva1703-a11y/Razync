name: Padronizar prévias bancárias
on:
  push:
    branches: [main]
    paths:
      - 'scripts/padronizar_previas_bancos.py'
      - '.github/workflows/padronizar_previas_bancos.yml'

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar padrão de prévias
        run: python scripts/padronizar_previas_bancos.py
      - name: Validar sintaxe e padrão
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          t = Path('app.py').read_text(encoding='utf-8')
          assert 'def renderizar_previa_bancos_padrao(' in t
          assert 'renderizar_previa_bancos_padrao(dados_accede)' in t
          assert 'renderizar_previa_bancos_padrao(dados_up_pack)' in t
          assert "ordem=['Itaú', 'Bradesco']" in t
          PY
      - name: Commitar alteração e limpar temporários
        run: |
          rm -f scripts/padronizar_previas_bancos.py .github/workflows/padronizar_previas_bancos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/padronizar_previas_bancos.py .github/workflows/padronizar_previas_bancos.yml
          git commit -m 'Padroniza prévias bancárias nas empresas multi-banco' || exit 0
          git push
