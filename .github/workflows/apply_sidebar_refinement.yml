name: Aplicar refinamento da sidebar

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_sidebar_ui.py'
      - '.github/workflows/apply_sidebar_refinement.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar refinamento visual
        run: python scripts/refine_sidebar_ui.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Registrar alteração e limpar patch temporário
        run: |
          rm scripts/refine_sidebar_ui.py
          rm .github/workflows/apply_sidebar_refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/refine_sidebar_ui.py .github/workflows/apply_sidebar_refinement.yml
          git commit -m 'Refina sidebar com navegação alinhada e profissional'
          git push
