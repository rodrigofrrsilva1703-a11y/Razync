name: Organizar prévias Radani em abas

on:
  push:
    branches: [main]
    paths:
      - 'scripts/organizar_previa_radani_abas.py'
      - '.github/workflows/organizar_previa_radani_abas.yml'

jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar alteração
        run: python scripts/organizar_previa_radani_abas.py
      - name: Validar sintaxe e abas
        run: |
          python -m py_compile app.py
          grep -q "abas_bancos_previa = st.tabs" app.py
          ! grep -q "st.markdown(f'##### {nome_banco_previa}')" app.py
      - name: Commitar alteração e limpar temporários
        run: |
          rm scripts/organizar_previa_radani_abas.py
          rm .github/workflows/organizar_previa_radani_abas.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/organizar_previa_radani_abas.py .github/workflows/organizar_previa_radani_abas.yml
          git commit -m "Organiza prévias da empresa 968 em abas por banco"
          git push
