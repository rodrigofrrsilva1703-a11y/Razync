name: Aplicar redesign compacto da Home
on:
  push:
    paths:
      - 'scripts/redesign_home_compact.py'
      - '.github/workflows/apply_home_compact_redesign.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar redesign
        run: python scripts/redesign_home_compact.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar Home
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'rz-home-metrics' in text
          assert 'Vencendo hoje' in text
          assert 'Progresso' in text
          assert 'padding-top: 1.65rem' in text
          assert 'total_empresas_home = len(EMPRESAS)' in text
          print('Home compacta validada')
          PY
      - name: Registrar alteração e limpar temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/redesign_home_compact.py .github/workflows/apply_home_compact_redesign.yml
          git add app.py scripts/redesign_home_compact.py .github/workflows/apply_home_compact_redesign.yml
          git commit -m "Redesenha Home para ocupar melhor a tela"
          git push
