name: Ajustar downloads 242
on:
  push:
    paths:
      - 'scripts/ajustar_downloads_242.py'
      - '.github/workflows/ajustar_downloads_242.yml'
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/ajustar_downloads_242.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/eletro_forte.py
      - name: Validar regras 242
        run: |
          python - <<'PY'
          from pathlib import Path
          t = Path('app.py').read_text(encoding='utf-8')
          for token in [
              'Baixar Despesa · Modelo Domínio',
              'Baixar Fornecedor · Modelo Domínio',
              'Baixar Recebido · Modelo Domínio',
              "ELETRO_FORTE_242_DESPESA_",
              "ELETRO_FORTE_242_FORNECEDOR_",
              "ELETRO_FORTE_242_RECEBIDO_",
          ]:
              assert token in t, token
          assert "'Baixar Modelo Domínio — Eletro Forte'" not in t
          PY
      - name: Commitar e limpar temporários
        run: |
          rm -f scripts/ajustar_downloads_242.py .github/workflows/ajustar_downloads_242.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/ajustar_downloads_242.py .github/workflows/ajustar_downloads_242.yml
          git commit -m 'Separa downloads da empresa 242 por relatório'
          git push
