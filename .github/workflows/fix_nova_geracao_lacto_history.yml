name: Ajustar histórico Nova Geração
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_nova_geracao_lacto_history.py'
      - '.github/workflows/fix_nova_geracao_lacto_history.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_nova_geracao_lacto_history.py
      - run: python -m py_compile app.py app_legacy.py
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_legacy.py
          git commit -m 'Preserva PAGO e RECEBIDO sem prefixo duplicado na Nova Geração' || true
          git rm scripts/fix_nova_geracao_lacto_history.py .github/workflows/fix_nova_geracao_lacto_history.yml
          git commit -m 'Remove ajuste temporário do histórico Nova Geração'
          git push
