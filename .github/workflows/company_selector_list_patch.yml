name: Aplicar seletor de empresas temporariamente

on:
  push:
    branches:
      - agent/company-selector-list

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-selector-list
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: Aplicar patch
        run: python scripts/apply_company_selector_list.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Limpar temporários e registrar alteração
        run: |
          rm scripts/apply_company_selector_list.py
          rm .github/workflows/company_selector_list_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/apply_company_selector_list.py .github/workflows/company_selector_list_patch.yml
          git commit -m "Substitui cards por seletores de empresas"
          git push
