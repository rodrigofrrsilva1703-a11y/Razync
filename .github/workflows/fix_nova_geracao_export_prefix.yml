name: Corrigir exportação Nova Geração
on:
  push:
    paths:
      - 'scripts/fix_nova_geracao_export_prefix.py'
      - '.github/workflows/fix_nova_geracao_export_prefix.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_nova_geracao_export_prefix.py
      - run: python -m py_compile app.py app_legacy.py
      - name: Validate targeted behavior
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app_legacy.py').read_text(encoding='utf-8')
          assert 'def gerar_excel_nova_geracao(dados_por_banco, modelo_bytes=None, prefixar_historicos=True):' in s
          assert "elif coluna == 'HISTÓRICO' and prefixar_historicos:" in s
          assert 'modelo_org_bytes,\n                        False' in s
          print('Validação OK')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/fix_nova_geracao_export_prefix.py .github/workflows/fix_nova_geracao_export_prefix.yml
          git add app_legacy.py scripts/fix_nova_geracao_export_prefix.py .github/workflows/fix_nova_geracao_export_prefix.yml
          git commit -m 'Corrige prefixo duplicado na exportação da 266 e 1396'
          git push
