name: Separar uploads UP PACK por banco
on:
  push:
    paths:
      - 'scripts/separate_up_pack_bank_uploads.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/separate_up_pack_bank_uploads.py
      - name: Validar
        run: |
          python -m py_compile app.py
          grep -q "Bancos para organizar" app.py
          grep -q "up_pack_sig_santander" app.py
          grep -q "up_pack_sig_sicredi" app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/separate_up_pack_bank_uploads.py .github/workflows/separate_up_pack_bank_uploads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/separate_up_pack_bank_uploads.py .github/workflows/separate_up_pack_bank_uploads.yml
          git commit -m 'Separa uploads da 1096 por banco'
          git push
