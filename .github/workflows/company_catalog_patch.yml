name: Aplicar catálogo temporariamente

on:
  push:
    branches: ["agent/company-regimes"]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-regimes
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Aplicar patch
        run: python scripts/apply_company_catalog_patch.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Remover arquivos temporários e registrar alteração
        run: |
          rm scripts/apply_company_catalog_patch.py
          rm .github/workflows/company_catalog_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py scripts/apply_company_catalog_patch.py .github/workflows/company_catalog_patch.yml
          git commit -m "Organiza empresas por regime tributário"
          git push origin HEAD:agent/company-regimes
