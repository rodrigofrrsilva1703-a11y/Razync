name: Fix 625 Base 3 bancos
on:
  push:
    paths:
      - 'scripts/fix_625_base_3_bancos.py'
      - '.github/workflows/fix_625_base_3_bancos.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_625_base_3_bancos.py
      - run: python -m py_compile app_legacy.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app_legacy.py
          git diff --cached --quiet || git commit -m 'Corrige aprendizado 625 para BB Caixa Sicredi'
          git push
