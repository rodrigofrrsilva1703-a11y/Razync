name: Finalizar lista de empresas sem cards temporariamente

on:
  push:
    branches:
      - agent/company-search-no-cards-3
    paths:
      - .github/workflows/finalize_company_search_no_cards.yml

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/company-search-no-cards-3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências e pytest
        run: |
          pip install -r requirements.txt
          pip install pytest
      - name: Aplicar alteração visual
        run: python scripts/apply_company_search_no_cards.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Limpar temporários e registrar alteração final
        run: |
          rm -f scripts/apply_company_search_no_cards.py
          rm -f .github/workflows/company_search_no_cards_patch.yml
          rm -f .github/workflows/debug_company_search_no_cards.yml
          rm -f .github/workflows/finalize_company_search_no_cards.yml
          rm -f validation_output.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove aparência de cards da seleção de empresas"
          git push origin agent/company-search-no-cards-3
