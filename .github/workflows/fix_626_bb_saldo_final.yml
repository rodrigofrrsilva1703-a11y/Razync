name: Fix 626 BB saldo final
on:
  push:
    paths:
      - 'scripts/fix_626_bb_saldo_final.py'
      - '.github/workflows/fix_626_bb_saldo_final.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_626_bb_saldo_final.py
      - run: python -m py_compile razync/valean_626.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add razync/valean_626.py
          git commit -m 'Corrige saldo final 999 no BB da empresa 626' || exit 0
          git push
