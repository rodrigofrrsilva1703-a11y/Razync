name: Base Despesa 242
on:
  push:
    branches: [main]
    paths:
      - 'scripts/ativar_base_despesa_242.py'
      - '.github/workflows/ativar_base_despesa_242.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ativar_base_despesa_242.py
      - name: Validar
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert "('Despesa', 'debito', {'0'})" in s
          assert "('Fornecedor', 'debito', {'166', '0'})" in s
          assert "('Recebido', 'credito', {'166', '0', '14', '16'})" in s
          assert "Somente linhas com DÉBITO 0 serão classificadas." in s
          print('OK')
          PY
      - name: Commitar
        run: |
          rm scripts/ativar_base_despesa_242.py
          rm .github/workflows/ativar_base_despesa_242.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/ativar_base_despesa_242.py .github/workflows/ativar_base_despesa_242.yml
          git commit -m 'Classifica debito 0 da Despesa na empresa 242'
          git push
