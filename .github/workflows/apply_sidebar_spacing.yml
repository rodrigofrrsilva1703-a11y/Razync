name: Ajustar espaçamento da sidebar

on:
  push:
    paths:
      - 'scripts/lower_sidebar_cards.py'
      - '.github/workflows/apply_sidebar_spacing.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/lower_sidebar_cards.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Registrar alteração e limpar temporários
        run: |
          rm scripts/lower_sidebar_cards.py
          rm .github/workflows/apply_sidebar_spacing.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/lower_sidebar_cards.py .github/workflows/apply_sidebar_spacing.yml
          git commit -m 'Ajusta posição dos cards na sidebar'
          git push
