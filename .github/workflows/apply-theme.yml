name: Apply Razync theme

on:
  push:
    paths:
      - 'scripts/patch_theme.py'
      - '.github/workflows/apply-theme.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-theme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply theme patch
        run: python scripts/patch_theme.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Adiciona tema claro e escuro ao Razync"
          git push
