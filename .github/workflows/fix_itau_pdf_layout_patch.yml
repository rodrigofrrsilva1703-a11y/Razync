name: Aplicar correção PDF Itaú temporariamente
on:
  push:
    branches: [agent/fix-itau-pdf-layout]
    paths:
      - scripts/apply_fix_itau_pdf_layout.py
      - .github/workflows/fix_itau_pdf_layout_patch.yml
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt pytest
      - name: Aplicar alteração
        run: python scripts/apply_fix_itau_pdf_layout.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Validar assinatura estrutural e continuidade Itaú
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert "assinatura_itau = (" in s
          assert "and not padrao_valor.search(atual[1])" in s
          assert "'saldo em conta corrente'" in s
          print('validações específicas Itaú: OK')
          PY
      - name: Limpar temporários e registrar alteração final
        run: |
          rm scripts/apply_fix_itau_pdf_layout.py
          rm .github/workflows/fix_itau_pdf_layout_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/apply_fix_itau_pdf_layout.py .github/workflows/fix_itau_pdf_layout_patch.yml
          git commit -m "Corrige leitura de extratos PDF do Itaú"
          git push
