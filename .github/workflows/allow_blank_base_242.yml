name: Classificar vazios Base 242
on:
  push:
    branches: [main]
    paths:
      - 'scripts/allow_blank_base_242.py'
      - '.github/workflows/allow_blank_base_242.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/allow_blank_base_242.py
      - run: python -m py_compile app.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Classifica células vazias na Base Inteligente da 242'
          git rm scripts/allow_blank_base_242.py .github/workflows/allow_blank_base_242.yml
          git commit -m 'Remove ajuste temporário da Base 242'
          git push
