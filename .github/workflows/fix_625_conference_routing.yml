name: Corrigir roteamento conferencia 625
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_625_conference_routing.py
      - .github/workflows/fix_625_conference_routing.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/fix_625_conference_routing.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/valean_625.py
      - name: Commit e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Corrige identificação dos extratos na conferência 625"
          git rm scripts/fix_625_conference_routing.py .github/workflows/fix_625_conference_routing.yml
          git commit -m "Remove correção temporária da conferência 625"
          git push
