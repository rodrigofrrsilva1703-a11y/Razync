name: Corrigir import hmac

on:
  push:
    paths:
      - 'scripts/patch_import_hmac.py'
      - '.github/workflows/apply-import-hmac.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aplicar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/patch_import_hmac.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar referências hmac
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert 'import hmac\n' in s
          if 'hmac.compare_digest' not in s:
              raise SystemExit('Nenhum uso de hmac.compare_digest encontrado para validar.')
          print('hmac importado e referências válidas.')
          PY
      - name: Commit da correção
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Corrige NameError de hmac na Base Inteligente"
          git push
