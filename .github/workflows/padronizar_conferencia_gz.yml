name: Padronizar conferencia GZ 1211
on:
  push:
    branches: [main]
    paths:
      - 'scripts/padronizar_conferencia_gz.py'
      - '.github/workflows/padronizar_conferencia_gz.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar
        run: python scripts/padronizar_conferencia_gz.py
      - name: Validar
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8')
          assert "renderizar_conferencia_autokraft(\n                'gz1211'" in t
          assert "bancos_config=[{'nome': 'Itaú', 'slug': 'itau'}]" in t
          print('OK')
          PY
      - name: Commitar
        run: |
          rm scripts/padronizar_conferencia_gz.py
          rm .github/workflows/padronizar_conferencia_gz.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/padronizar_conferencia_gz.py .github/workflows/padronizar_conferencia_gz.yml
          git commit -m 'Padroniza conferencia da empresa 1211 GZ'
          git push
