name: Corrigir import UP PACK
on:
  push:
    paths:
      - 'scripts/fix_up_pack_import_v2.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/fix_up_pack_import_v2.py
      - name: Validar sintaxe
        run: |
          python -m py_compile app.py
          grep -q 'Configuração local da UP PACK' app.py
          ! grep -q 'CONFIGURACOES_ACCEDE, CONFIGURACOES_UP_PACK' app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/fix_up_pack_import_v2.py .github/workflows/fix_up_pack_import_v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_up_pack_import_v2.py .github/workflows/fix_up_pack_import_v2.yml
          git commit -m 'Corrige import da UP PACK no Streamlit'
          git push
