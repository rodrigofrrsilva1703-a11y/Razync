name: Aplicar hardening bancário

on:
  workflow_run:
    workflows: ["Validar Razync"]
    types: [completed]

permissions:
  contents: write

jobs:
  aplicar:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Aplicar hardening
        run: python scripts/harden_bank_diagnostics.py
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/*.py
      - name: Executar testes
        run: pytest -q
      - name: Validar hardening no app
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('app.py').read_text(encoding='utf-8')
          checks = [
              'from razync.bank_validation import diagnostico_pdf_sem_lancamentos, validar_fechamento_saldo',
              "reader._razync_ocr_executado = modo_ocr",
              "reader._razync_balance_check = validar_fechamento_saldo",
              "st.session_state['ultimo_erro_extrato'] = diagnostico_pdf_sem_lancamentos",
              "fechamento.get('ok') is False",
          ]
          for check in checks:
              assert check in app, check
          print('Hardening bancário presente.')
          PY
      - name: Iniciar Streamlit
        run: |
          streamlit run app.py --server.headless=true --server.port=8501 > /tmp/razync-streamlit.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for tentativa in {1..25}; do
            if curl --fail --silent http://127.0.0.1:8501/_stcore/health; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/razync-streamlit.log
          exit 1
      - name: Gravar hardening validado
        run: |
          if git diff --quiet -- app.py; then
            echo 'Sem alterações no app.py'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Fortalece diagnóstico e validação dos extratos bancários'
          git push origin main
