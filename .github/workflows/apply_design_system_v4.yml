name: Aplicar Design System v4

on:
  push:
    paths:
      - 'scripts/apply_design_system_v4.py'
      - '.github/workflows/apply_design_system_v4.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar Design System
        run: python scripts/apply_design_system_v4.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar estrutura visual
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app.py').read_text(encoding='utf-8')
          assert 'Razync Design System v4' in text
          assert 'rz-task-hero' in text
          assert 'Concluir selecionadas' in text
          assert 'Concluir automaticamente quando uma ferramenta gerar resultado válido' in text
          print('Design System e automações preservadas.')
          PY
      - name: Registrar alteração e limpar temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git rm scripts/apply_design_system_v4.py .github/workflows/apply_design_system_v4.yml
          git commit -m "Aplica Design System premium ao Razync"
          git push
