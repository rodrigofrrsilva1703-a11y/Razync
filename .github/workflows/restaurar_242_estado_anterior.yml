name: Restaurar 242 estado anterior
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restaurar_242_estado_anterior.yml'
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar arquivos da 242
        run: |
          git show be0f2ac20fa66388174668c2ba037d09f6829d34:app.py > app.py
          git show be0f2ac20fa66388174668c2ba037d09f6829d34:razync/eletro_forte.py > razync/eletro_forte.py
          git show be0f2ac20fa66388174668c2ba037d09f6829d34:razync/eletro_forte_francesinhas.py > razync/eletro_forte_francesinhas.py
          python -m py_compile app.py razync/eletro_forte.py razync/eletro_forte_francesinhas.py
      - name: Commit restauração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/eletro_forte.py razync/eletro_forte_francesinhas.py
          git commit -m 'Restaura comportamento anterior da empresa 242' || true
          git rm .github/workflows/restaurar_242_estado_anterior.yml
          git commit -m 'Remove workflow temporario de restauracao da 242'
          git push
