name: Integrar empresa 969 Engekraft
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrar_engekraft_969.py'
      - '.github/workflows/integrar_engekraft_969.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/integrar_engekraft_969.py
      - name: Validar
        run: |
          python -m py_compile app.py razync/engekraft_969.py razync/company_catalog.py
          python - <<'PY'
          from pathlib import Path
          t=Path('app.py').read_text(encoding='utf-8')
          assert "empresa_organizador'] == 'engekraft_969'" in t
          assert "'Organizar arquivos', 'Base Inteligente'" in t
          assert "'engekraft969', bancos_config=[{'nome': 'Itaú', 'slug': 'itau'}]" in t
          p=Path('razync/engekraft_969.py').read_text(encoding='utf-8')
          assert 'prefixo = "Recebido: " if valor > 0 else "Pago: "' in p
          print('OK')
          PY
      - name: Commitar
        run: |
          rm scripts/integrar_engekraft_969.py
          rm .github/workflows/integrar_engekraft_969.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/company_catalog.py scripts/integrar_engekraft_969.py .github/workflows/integrar_engekraft_969.yml
          git commit -m 'Integra ferramentas da empresa 969 Engekraft'
          git push
