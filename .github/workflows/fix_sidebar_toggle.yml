name: Corrigir controle da barra lateral
on:
  push:
    paths:
      - 'scripts/fix_sidebar_toggle.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/fix_sidebar_toggle.py
      - name: Validar
        run: |
          python -m py_compile app.py
          grep -q 'pointer-events: auto !important' app.py
          grep -q 'min-height: 2.4rem !important' app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/fix_sidebar_toggle.py .github/workflows/fix_sidebar_toggle.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/fix_sidebar_toggle.py .github/workflows/fix_sidebar_toggle.yml
          git commit -m 'Restaura abertura e fechamento da barra lateral'
          git push
