name: Padronizar abas nativas da Radani
on:
  push:
    branches: [main]
    paths:
      - 'scripts/standardize_radani_native_tabs.py'
      - '.github/workflows/standardize_radani_native_tabs.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar padronização
        run: python scripts/standardize_radani_native_tabs.py
      - name: Instalar dependências mínimas
        run: pip install -q streamlit pandas pypdf openpyxl pytest
      - name: Validar
        run: |
          python -m py_compile app.py razync/radani.py
          PYTHONPATH=. pytest -q tests/test_radani.py
          grep -q "aba_operacoes_radani, aba_base_radani = st.tabs" app.py
          ! grep -q "radani_modo_ferramenta" app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/standardize_radani_native_tabs.py .github/workflows/standardize_radani_native_tabs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Padroniza layout nativo da empresa 968' || exit 0
          git push
