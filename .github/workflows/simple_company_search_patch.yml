name: Aplicar busca simples de empresas temporariamente

on:
  push:
    branches:
      - agent/simple-company-search
    paths:
      - scripts/apply_simple_company_search.py
      - .github/workflows/simple_company_search_patch.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simple-company-search
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Aplicar patch
        run: python scripts/apply_simple_company_search.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Limpar temporários e registrar alteração
        run: |
          rm scripts/apply_simple_company_search.py
          rm .github/workflows/simple_company_search_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.py scripts/apply_simple_company_search.py .github/workflows/simple_company_search_patch.yml
          git commit -m "Simplifica seleção de empresas"
          git push origin HEAD:agent/simple-company-search
