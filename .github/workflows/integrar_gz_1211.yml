name: Integrar GZ 1211
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrar_gz_1211.py'
      - '.github/workflows/integrar_gz_1211.yml'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar integração
        run: python scripts/integrar_gz_1211.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/gz_1211.py razync/company_catalog.py
      - name: Validar regras GZ
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          c = Path('razync/company_catalog.py').read_text(encoding='utf-8')
          g = Path('razync/gz_1211.py').read_text(encoding='utf-8')
          assert '"chave_sistema": "gz_1211"' in c
          assert "empresa_organizador'] == 'gz_1211'" in s
          assert 'Conferência com Extrato' in s
          assert 'Base Inteligente' in s
          assert 'Recebido: {boleto.pagador}' in g
          assert 'CONTA_ITAU_GZ = "508"' in g
          assert 'BOLETOS RECEBIDOS' in g
          print('Regras GZ validadas')
          PY
      - name: Commitar e limpar temporários
        run: |
          rm -f scripts/integrar_gz_1211.py .github/workflows/integrar_gz_1211.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/company_catalog.py razync/gz_1211.py scripts/integrar_gz_1211.py .github/workflows/integrar_gz_1211.yml
          git commit -m 'Integra ferramentas da empresa 1211 GZ'
          git push origin main
