name: Patch 625 Caixa PESSOAL
on:
  push:
    paths:
      - 'scripts/patch_625_caixa_pessoal.py'
      - '.github/workflows/patch_625_caixa_pessoal.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar patch
        run: python scripts/patch_625_caixa_pessoal.py
      - name: Validar sintaxe
        run: python -m py_compile razync/valean_625.py
      - name: Commit e limpeza
        run: |
          rm scripts/patch_625_caixa_pessoal.py .github/workflows/patch_625_caixa_pessoal.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add razync/valean_625.py scripts/patch_625_caixa_pessoal.py .github/workflows/patch_625_caixa_pessoal.yml
          git commit -m 'Suporta novo extrato Caixa PESSOAL na 625'
          git push
