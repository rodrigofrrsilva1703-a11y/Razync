name: Ajustar despesa 242 por banco
on:
  push:
    paths:
      - 'scripts/ajustar_despesa_242_por_banco.py'
      - '.github/workflows/ajustar_despesa_242_por_banco.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar
        run: python scripts/ajustar_despesa_242_por_banco.py
      - name: Validar
        run: |
          python -m py_compile app.py razync/eletro_forte.py
          grep -q "Despesa · " app.py
          grep -q "if despesas_ef:" app.py
      - name: Commitar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f scripts/ajustar_despesa_242_por_banco.py .github/workflows/ajustar_despesa_242_por_banco.yml
          git add -A
          git commit -m 'Completa separação de despesas 242 por banco' || exit 0
          git push origin main
