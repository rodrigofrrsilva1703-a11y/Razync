name: Aplicar ajuste vertical do conteúdo
on:
  push:
    paths:
      - 'scripts/raise_main_content.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar ajuste
        run: python scripts/raise_main_content.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar alinhamento
        run: |
          grep -q 'Main content vertical alignment v2' app.py
          grep -q 'padding-top: 1.15rem' app.py
      - name: Registrar e limpar temporários
        run: |
          rm -f scripts/raise_main_content.py .github/workflows/apply_raise_main_content.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/raise_main_content.py .github/workflows/apply_raise_main_content.yml
          git commit -m 'Sobe conteúdo principal e reduz espaço vazio'
          git push
