name: Inspecionar prefixos 266 1396
on:
  push:
    branches: [main]
    paths:
      - 'scripts/inspect_nova_geracao_prefixes.py'
      - '.github/workflows/inspect_nova_geracao_prefixes.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_nova_geracao_prefixes.py
