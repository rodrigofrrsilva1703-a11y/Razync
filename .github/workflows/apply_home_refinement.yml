name: Aplicar refinamento visual da home

on:
  push:
    paths:
      - 'scripts/refine_home_simple.py'
      - '.github/workflows/apply_home_refinement.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar refinamento
        run: python scripts/refine_home_simple.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Registrar alteração e limpar arquivos temporários
        run: |
          rm -f scripts/refine_home_simple.py .github/workflows/apply_home_refinement.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Refina visual da tela inicial' || exit 0
          git push origin main
