name: Integrar leitor Bradesco da Radani
on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_bradesco_radani_reader.py'
      - '.github/workflows/integrate_bradesco_radani_reader.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar integração
        run: python scripts/integrate_bradesco_radani_reader.py
      - name: Instalar dependências mínimas
        run: pip install pandas pypdf pymupdf pytesseract pillow openpyxl pytest
      - name: Validar
        run: |
          python -m py_compile app.py razync/bradesco_radani.py razync/radani.py
          PYTHONPATH=. pytest -q tests/test_radani.py
      - name: Registrar e limpar
        run: |
          rm scripts/integrate_bradesco_radani_reader.py .github/workflows/integrate_bradesco_radani_reader.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Integra leitor robusto Bradesco na empresa 968' || exit 0
          git push
