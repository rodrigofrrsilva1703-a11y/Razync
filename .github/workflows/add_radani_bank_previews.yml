name: Adicionar prévia bancária Radani
on:
  push:
    branches: [main]
    paths:
      - 'scripts/add_radani_bank_previews.py'
      - '.github/workflows/add_radani_bank_previews.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar prévia
        run: python scripts/add_radani_bank_previews.py
      - name: Instalar dependências mínimas
        run: pip install pandas pypdf openpyxl pytest streamlit
      - name: Validar
        run: |
          python -m py_compile app.py
          PYTHONPATH=. pytest -q tests/test_radani.py tests/test_bradesco_radani.py
          grep -q "Pré-visualização por banco" app.py
          grep -q "previa_bancos" app.py
      - name: Registrar e limpar
        run: |
          rm scripts/add_radani_bank_previews.py .github/workflows/add_radani_bank_previews.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Adiciona prévia de lançamentos por banco na 968' || exit 0
          git push
