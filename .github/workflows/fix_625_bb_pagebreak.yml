name: Fix 625 BB pagebreak
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_625_bb_pagebreak.py'
      - '.github/workflows/fix_625_bb_pagebreak.yml'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplica patch
        run: python scripts/fix_625_bb_pagebreak.py
      - name: Valida sintaxe
        run: python -m py_compile razync/valean_625.py
      - name: Commit e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add razync/valean_625.py
          git commit -m 'Corrige quebra de página no extrato BB 625' || true
          git rm scripts/fix_625_bb_pagebreak.py .github/workflows/fix_625_bb_pagebreak.yml
          git commit -m 'Remove patch temporário BB 625'
          git push
