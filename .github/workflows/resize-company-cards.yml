name: Resize company cards

on:
  push:
    paths:
      - 'scripts/resize_company_cards.py'
      - '.github/workflows/resize-company-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply card resize
        run: python scripts/resize_company_cards.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Guard against placeholder corruption
        run: |
          if grep -qx 'PLACEHOLDER' app.py; then
            echo 'app.py corrompido'
            exit 1
          fi
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py
          git commit -m 'Deixa cards das empresas menores e mais quadrados'
          git push
