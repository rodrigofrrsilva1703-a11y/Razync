name: Fix francesinhas centavos 242
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_francesinhas_centavos_242.py'
      - '.github/workflows/fix_francesinhas_centavos_242.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/fix_francesinhas_centavos_242.py
      - name: Validar sintaxe
        run: python -m py_compile razync/eletro_forte.py razync/eletro_forte_francesinhas.py
      - name: Commit e limpeza
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add razync/eletro_forte.py
          git commit -m 'Corrige correspondencia de 1 centavo nas francesinhas 242' || true
          git rm scripts/fix_francesinhas_centavos_242.py .github/workflows/fix_francesinhas_centavos_242.yml
          git commit -m 'Remove ajuste temporario de centavos 242'
          git push
