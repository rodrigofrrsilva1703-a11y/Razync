name: Corrigir saldo devedor BB 625
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_625_bb_saldo_devedor.py
      - .github/workflows/fix_625_bb_saldo_devedor.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/fix_625_bb_saldo_devedor.py
      - run: python -m py_compile razync/valean_625.py
      - name: Testar IOF Saldo Devedor
        run: |
          python - <<'PY'
          import razync.valean_625 as v
          v._texto_pdf=lambda _: '02/03/2026 0000 13601 118 Cobrança de I.O.F. 391.100.702 75,77 D 8.905,98 D\nIOF Saldo Devedor Conta\n'
          df=v.processar_bb_625(b'x')
          assert len(df)==1
          assert df.iloc[0]['VALOR']==-75.77
          assert 'IOF Saldo Devedor Conta' in df.iloc[0]['HISTÓRICO']
          print(df.to_dict('records'))
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add razync/valean_625.py
          git commit -m 'Mantém IOF Saldo Devedor como lançamento BB válido na 625'
          git rm scripts/fix_625_bb_saldo_devedor.py .github/workflows/fix_625_bb_saldo_devedor.yml
          git commit -m 'Remove patch temporário saldo devedor BB 625'
          git push
