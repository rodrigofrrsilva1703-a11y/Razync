name: Limpeza final historico 625
on:
  push:
    branches: [main]
    paths:
      - scripts/fix_625_final_history_cleanup.py
      - .github/workflows/fix_625_final_history_cleanup.yml
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/fix_625_final_history_cleanup.py
      - run: python -m py_compile app.py razync/valean_625.py
      - name: Validar patch
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('app.py').read_text(encoding='utf-8')
          assert '_sanitizar_historico_625' in s
          assert 'st.session_state["valean_625_quadros"] = quadros_limpos' in s
          print('Validação OK')
          PY
      - name: Commit e limpeza
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Garante limpeza final de CPF CNPJ na empresa 625"
          git rm scripts/fix_625_final_history_cleanup.py .github/workflows/fix_625_final_history_cleanup.yml
          git commit -m "Remove patch temporário da limpeza 625"
          git push
