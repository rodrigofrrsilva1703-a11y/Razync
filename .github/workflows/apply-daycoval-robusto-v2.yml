name: Corrigir Daycoval robusto V2

on:
  push:
    paths:
      - 'scripts/patch_daycoval_robusto_v2.py'
      - '.github/workflows/apply-daycoval-robusto-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar parser robusto
        run: python scripts/patch_daycoval_robusto_v2.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar integração central
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          checks = [
              'def desfragmentar_linha(linha):',
              'lancamentos_simples = processar_fonte(texto_simples_total)',
              "if periodo and not (periodo[0] <= data_lancamento <= periodo[1]):",
              "processar_pdf_daycoval_detalhado(\n                reader, banco_identificado\n            )",
              'processar_extrato_unificado,\n                ext_bytes,\n                arq_extrato.name',
          ]
          for check in checks:
              assert check in s, check
          print('Parser central e Conciliação com Razão confirmados.')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Torna leitura Daycoval robusta em todas as ferramentas"
          git push
