name: Aplicar correção vertical do Organizador
on:
  push:
    paths:
      - 'scripts/raise_organizer_directory.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar correção
        run: python scripts/raise_organizer_directory.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Confirmar correção
        run: |
          grep -q 'Organizer directory vertical fix v3' app.py
          grep -q 'margin-top: -5.25rem' app.py
      - name: Registrar e limpar temporários
        run: |
          rm -f scripts/raise_organizer_directory.py .github/workflows/apply_organizer_vertical_fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/raise_organizer_directory.py .github/workflows/apply_organizer_vertical_fix.yml
          git commit -m 'Reposiciona diretório do Organizador no topo'
          git push
