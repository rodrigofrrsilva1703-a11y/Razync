name: Refinar botão lateral Razync
on:
  push:
    paths:
      - 'scripts/refine_sidebar_button_v8.py'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar refinamento
        run: python scripts/refine_sidebar_button_v8.py
      - name: Validar
        run: |
          python -m py_compile app.py
          grep -q 'Botão lateral Razync v8' app.py
          grep -q 'width: 2.10rem' app.py
          grep -q 'position: absolute !important' app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/refine_sidebar_button_v8.py .github/workflows/refine_sidebar_button_v8.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/refine_sidebar_button_v8.py .github/workflows/refine_sidebar_button_v8.yml
          git commit -m 'Refina botão lateral do Razync'
          git push
