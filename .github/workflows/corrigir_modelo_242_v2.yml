name: Corrigir Modelo Dominio 242 v2
on:
  push:
    branches: [main]
    paths:
      - 'scripts/corrigir_modelo_242_v2.py'
      - '.github/workflows/corrigir_modelo_242_v2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/corrigir_modelo_242_v2.py
      - name: Validar sintaxe
        run: python -m py_compile app.py razync/eletro_forte.py
      - name: Validar assinatura e colunas
        run: |
          python - <<'PY'
          from pathlib import Path
          mod = Path('razync/eletro_forte.py').read_text(encoding='utf-8')
          app = Path('app.py').read_text(encoding='utf-8')
          assert 'COLUNAS_MODELO = ["DESCRIÇÃO", "DATA", "VALOR", "DÉBITO", "CRÉDITO", "HISTÓRICO"]' in mod
          assert 'ws_principal = wb.create_sheet("Principal", 0)' in mod
          assert 'arq_despesa_ef.getvalue(), arq_despesa_ef.name' in app
          assert 'modelo_bytes_ef' in app
          PY
      - name: Commitar alteração e limpar temporários
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py razync/eletro_forte.py
          git rm scripts/corrigir_modelo_242_v2.py .github/workflows/corrigir_modelo_242_v2.yml
          git commit -m 'Corrige estrutura das planilhas da empresa 242' || exit 0
          git push
