name: Aplicar links de texto das empresas temporariamente

on:
  push:
    branches:
      - agent/company-text-links
    paths:
      - scripts/apply_company_text_links.py
      - .github/workflows/company_text_links_patch.yml

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar Tesseract português
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-por
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Aplicar alteração
        run: python scripts/apply_company_text_links.py
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile app.py razync/*.py
          pytest -q
      - name: Limpar temporários e registrar alteração final
        run: |
          rm scripts/apply_company_text_links.py
          rm .github/workflows/company_text_links_patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py scripts/apply_company_text_links.py .github/workflows/company_text_links_patch.yml
          git commit -m "Transforma nomes das empresas em links visuais" || exit 0
          git push
