name: Fix 626 Base bancos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_626_base_bancos.py'
      - '.github/workflows/fix_626_base_bancos.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/fix_626_base_bancos.py
      - run: python -m py_compile app_legacy.py app.py razync/valean_626.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app_legacy.py
          git commit -m "Permite aprendizado BB e Sicredi na empresa 626" || true
          git push
      - run: |
          git pull --rebase
          git rm -f scripts/fix_626_base_bancos.py .github/workflows/fix_626_base_bancos.yml
          git commit -m "Remove patch temporário Base 626" || true
          git push
