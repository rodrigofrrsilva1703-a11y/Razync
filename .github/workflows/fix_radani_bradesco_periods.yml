name: Corrigir períodos Bradesco Radani
on:
  push:
    branches: [main]
    paths:
      - 'scripts/fix_radani_bradesco_periods.py'
      - '.github/workflows/fix_radani_bradesco_periods.yml'
jobs:
  aplicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/fix_radani_bradesco_periods.py
      - name: Instalar dependências mínimas
        run: pip install pandas pytest
      - name: Validar
        run: |
          python -m py_compile app.py razync/bradesco_radani.py
          PYTHONPATH=. pytest -q tests/test_bradesco_radani_periods.py tests/test_radani.py
          grep -q "datas_sem_lancamento" razync/bradesco_radani.py
      - name: Registrar e limpar
        run: |
          rm scripts/fix_radani_bradesco_periods.py .github/workflows/fix_radani_bradesco_periods.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Corrige períodos ausentes do Bradesco na empresa 968' || exit 0
          git push
