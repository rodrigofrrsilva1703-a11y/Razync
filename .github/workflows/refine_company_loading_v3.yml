name: Refinar loading entre empresas
on:
  push:
    paths:
      - 'scripts/refine_company_loading_v3.py'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar refinamento
        run: python scripts/refine_company_loading_v3.py
      - name: Validar
        run: |
          python -m py_compile app.py
          grep -q 'rz-company-loading-shell' app.py
          grep -q 'time.sleep(0.30)' app.py
          ! grep -q 'rz-company-loading-track' app.py
      - name: Registrar e limpar
        run: |
          rm -f scripts/refine_company_loading_v3.py .github/workflows/refine_company_loading_v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py scripts/refine_company_loading_v3.py .github/workflows/refine_company_loading_v3.yml
          git commit -m 'Refina loading na troca de empresas'
          git push
