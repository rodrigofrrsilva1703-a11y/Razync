name: Apply square company cards

on:
  push:
    paths:
      - 'scripts/patch_company_cards_square.py'
      - 'scripts/fix_bradesco_footer.py'
      - '.github/workflows/apply-company-cards-square.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply main patch
        run: python scripts/patch_company_cards_square.py
      - name: Fix Bradesco footer filter
        run: python scripts/fix_bradesco_footer.py
      - name: Validate syntax
        run: python -m py_compile app.py
      - name: Commit update
        run: |
          if git diff --quiet -- app.py; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Corrige leitura central do PDF Bradesco"
          git push
