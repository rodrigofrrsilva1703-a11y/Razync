name: Corrigir Daycoval texto simples

on:
  push:
    paths:
      - 'scripts/patch_daycoval_texto_simples.py'
      - '.github/workflows/apply-daycoval-texto-simples.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Aplicar correção
        run: python scripts/patch_daycoval_texto_simples.py
      - name: Validar sintaxe
        run: python -m py_compile app.py
      - name: Validar parser Daycoval
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('app.py').read_text(encoding='utf-8')
          assert 'fontes_texto = textos_simples + textos_layout' in s
          assert 'for texto_pagina in fontes_texto:' in s
          print('Parser Daycoval com fallback confirmado.')
          PY
      - name: Commit
        run: |
          if git diff --quiet -- app.py; then
            echo "Sem alterações"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          git commit -m "Corrige leitura de PDFs recentes do Daycoval"
          git push
