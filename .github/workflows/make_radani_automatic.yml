name: Automatizar processamento Radani 968

on:
  push:
    branches: [main]
    paths:
      - 'scripts/make_radani_automatic.py'
      - '.github/workflows/make_radani_automatic.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Aplicar alteração
        run: python scripts/make_radani_automatic.py
      - name: Validar sintaxe e remoção do botão manual
        run: |
          python -m py_compile app.py
          ! grep -q "Processar 968" app.py
          ! grep -q "radani_processar_arquivos" app.py
          grep -q "precisa_processar_radani" app.py
      - name: Commitar alteração e limpar arquivos temporários
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/make_radani_automatic.py .github/workflows/make_radani_automatic.yml
          git add app.py scripts/make_radani_automatic.py .github/workflows/make_radani_automatic.yml
          git commit -m "Deixa processamento da empresa 968 automático"
          git push
